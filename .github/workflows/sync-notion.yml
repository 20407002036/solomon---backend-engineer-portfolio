name: Sync GitHub projects to Notion

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Sync GitHub repos to Notion
        run: python Backend/sync_github_to_notion.py
        env:
          GITHUB_USERNAME: ${{ vars.SYNC_GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NOTION_ACCESS_KEY: ${{ secrets.NOTION_ACCESS_KEY }}
          NOTION_PROJECTS_DATABASE_ID: ${{ secrets.NOTION_PROJECTS_DATABASE_ID }}
